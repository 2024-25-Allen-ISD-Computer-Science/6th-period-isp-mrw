<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Reviews</title>
    <style>
        body {
            font-family: monospace;
            margin: 0;
            padding: 0;
            background-color: #FFF4F2;
            color: #2e2528;
        }
        nav {
        background-color: #F5DCE0; 
        padding: 10px 0; 
        display: flex; 
        justify-content: center; 
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); 
        }
        nav a {
        margin: 0 15px; 
        color: rgb(37, 37, 37); 
        text-decoration: none; 
        padding: 10px 15px; 
        border-radius: 5px; 
        transition: background-color 0.3s; 
        }
        nav a:hover, nav a.active {
        background-color: #EFCFD4;  
        }
        .container {
            width: 80%;
            margin: 30px auto;
        }
        .section {
            background: white;
            color:  #332129;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px #EFCFD4;
            margin-bottom: 20px;
        }
        header {
            background-color: #EFCFD4;
            color: #332129;
            padding: 20px;
            text-align: center;
        }
        .review-container {
            background: #fcf0f2;
            color: #332129;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px #EFCFD4;
            margin: 20px auto;
            text-align: center;
            max-width: 600px;
        }
        .star-rating {
            display: flex;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
        }
        .star {
            color: #ccc;
            transition: color 0.3s;
        }
        .star:hover,
        .star.active {
            color: gold;
        }
        .review-list {
            margin-top: 20px;
            text-align: left;
        }
        .review-item {
            border-bottom: 1px solid #EFCFD4;
            padding: 10px;
            margin-bottom: 10px;
        }
        .rating-display {
            font-size: 20px;
            color: gold;
        }
    </style>
</head>
<body>
<header>
    <h1>⋆｡‧˚ʚ🍓ɞ˚‧｡⋆ Reviews ⋆｡‧˚ʚ🍒ɞ˚‧｡⋆</h1>
</header>
<nav>
    <a href="index.html" class="active">Home</a>
    <a href="genres.html">Genres</a>
    <a href="discover.html">Discover</a>
    <a href="artists.html">Artists</a>
    <a href="songs.html">Songs</a>
    <a href="learn-more.html">Learn More</a>
    <a href="review.html">Reviews</a>
    <a href="login.html">Login</a>
</nav>
<div class="review-container">
    <h2>Rate Our Website</h2>
    <div class="star-rating" id="starRating">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
    </div>
    <textarea id="reviewText" placeholder="Write your review here..." rows="4" cols="50"></textarea><br><br>
    <button onclick="submitReview()">Submit Review</button>
    <h2>Filter Reviews</h2>
    <select id="filterRating" onchange="filterReviews()">
        <option value="all">All Ratings</option>
        <option value="5">5 Stars</option>
        <option value="4">4 Stars</option>
        <option value="3">3 Stars</option>
        <option value="2">2 Stars</option>
        <option value="1">1 Star</option>
    </select>
    <h2>What Users Say</h2>
    <div class="review-list" id="reviewList"></div>
</div>
<script>
    let selectedRating = 0;
    
    document.querySelectorAll('.star').forEach(star => {
        star.addEventListener('mouseover', function() {
            let value = this.getAttribute('data-value');
            highlightStars(value);
        });
        star.addEventListener('click', function() {
            selectedRating = this.getAttribute('data-value');
            highlightStars(selectedRating, true);
        });
        star.addEventListener('mouseleave', function() {
            highlightStars(selectedRating, true);
        });
    });
    
    function highlightStars(value, persist = false) {
        document.querySelectorAll('.star').forEach(star => {
            star.classList.remove('active');
            if (star.getAttribute('data-value') <= value) {
                star.classList.add('active');
            }
        });
    }
    
    function submitReview() {
        let reviewText = document.getElementById("reviewText").value.trim();
        if (selectedRating == 0 || !reviewText) {
            alert("Please select a rating and write a review.");
            return;
        }
        let reviews = JSON.parse(localStorage.getItem("websiteReviews")) || [];
        reviews.push({ rating: selectedRating, reviewText });
        localStorage.setItem("websiteReviews", JSON.stringify(reviews));
        displayReviews();
        document.getElementById("reviewText").value = "";
        selectedRating = 0;
        highlightStars(0);
    }
    
    function displayReviews(filter = "all") {
        let reviews = JSON.parse(localStorage.getItem("websiteReviews")) || [];
        let reviewList = document.getElementById("reviewList");
        reviewList.innerHTML = "";
        
        let filteredReviews = filter === "all" ? reviews : reviews.filter(r => r.rating == filter);
        
        filteredReviews.forEach(review => {
            let stars = "★".repeat(review.rating) + "☆".repeat(5 - review.rating);
            let reviewItem = document.createElement("div");
            reviewItem.classList.add("review-item");
            reviewItem.innerHTML = `
                <span class="rating-display">${stars}</span><br>
                <p>${review.reviewText}</p>
            `;
            reviewList.appendChild(reviewItem);
        });
    }
    
    function filterReviews() {
        let filterValue = document.getElementById("filterRating").value;
        displayReviews(filterValue);
    }
    
    window.onload = () => displayReviews();
</script>
</body>
</html>
